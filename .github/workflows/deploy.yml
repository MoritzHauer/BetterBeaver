name: Check and deploy

on:
  push:
    branches: [main]
  # The check job is the only gate this repo has, and until now it ran after
  # merge — a red `main` was how you found out. Running it on the PR is what
  # `docs/design.md` said was missing.
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Per-ref: a PR's check run must never cancel a deploy already running on
  # `main`, which one shared `pages` group would have let it do.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quality gate: the same `pnpm check` run locally, enforced on every pull
  # request and again on the push that merges it.
  # With Supabase vars set it also runs the published-catalog guardrail
  # (packages/engine/src/publishedCatalog.test.ts) — a live-backend vs
  # deployed-bundle divergence blocks the deploy instead of reaching learners.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      # `pnpm check` now includes a real-browser suite (the "e2e" vitest
      # project). Locally the browser is a once-per-machine step; a runner is
      # a fresh machine every time, so it has to be installed here or the
      # gate fails on a missing executable rather than on the code.
      - run: corepack pnpm exec playwright install --with-deps chromium
      - run: corepack pnpm check
        env:
          # Mapped from the public build vars; unset → the guardrail test skips.
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

  deploy:
    needs: check
    # Pull requests get the gate, not the deploy: betterbeaver.de is served
    # from `main` only.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @betterbeaver/web build
        env:
          BASE_PATH: /
          # Repo → Settings → Variables (public by design; RLS is the
          # boundary, plan 0012 §4). Unset → the app ships bundled-only.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
